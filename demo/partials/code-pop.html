<div class="code-pop" id="code-pop" role="dialog" aria-modal="false" aria-labelledby="code-pop-title" hidden tabindex="-1">
  <div class="code-pop-head">
    <p class="corn-eyebrow" id="code-pop-title">代码</p>
    <button type="button" class="code-pop-close" data-pop-close aria-label="关闭代码浮层">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="code-pop-tabs" role="tablist" aria-label="代码类型"></div>
  <pre class="code-pop-code" tabindex="0" aria-label="代码内容"><code></code></pre>
  <div class="code-pop-foot">
    <span class="code-pop-meta corn-mono"></span>
    <span class="code-pop-status" role="status" aria-live="polite"></span>
    <button type="button" class="corn-btn corn-btn-maize corn-btn-sm code-pop-copy" data-pop-copy>
      <span class="code-pop-copy-label">复制代码</span>
    </button>
  </div>
</div>
