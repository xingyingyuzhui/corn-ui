<!-- Motion studies: three tactile mini-experiments with editorial stages.
     Each card keeps .mfx anatomy; data-manual-motion excludes them from the
     generic gallery autoplay — they have their own controls. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-code" viewBox="0 0 14 14"><path d="M5 3.5 1.5 7 5 10.5M9 3.5 12.5 7 9 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="ic-replay" viewBox="0 0 14 14"><path d="M11.8 7a4.8 4.8 0 1 1-1.4-3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M12 1.8v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
</svg>

<div class="studies-head">
  <h2 class="corn-h3">互动实验</h2>
</div>
<div class="motion-studies">
  <article class="mfx mfx-study" id="study-peel" data-manual-motion>
    <div class="mfx-stage study-peel">
      <div class="peel-stage-inner">
        <div class="peel-poster">
          <span class="peel-poster-tag">HARVEST / 2026</span>
          <b class="peel-poster-title">新季<br>有好事。</b>
          <i class="peel-poster-mark" aria-hidden="true"></i>
        </div>
        <div class="peel-leaf peel-leaf-l" aria-hidden="true"></div>
        <div class="peel-leaf peel-leaf-r" aria-hidden="true"></div>
      </div>
    </div>
    <div class="study-ctl">
      <label for="mfx-peel">剥开程度</label>
      <input type="range" id="mfx-peel" min="0" max="100" step="1" value="100" aria-valuetext="剥开 100%">
      <output id="mfx-peel-out" for="mfx-peel">100%</output>
      <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" id="mfx-peel-replay">再剥一次</button>
    </div>
    <footer class="mfx-meta"><h3 class="mfx-name">01 / 剥开这一季</h3>
      <div class="mfx-actions"><button type="button" class="code-trigger" aria-haspopup="dialog" aria-expanded="false" data-code-title="剥叶" data-code-html="t-peel" data-code-css="t-studies-css" data-code-js="t-studies-js"><svg class="ic" viewBox="0 0 14 14" aria-hidden="true"><use href="#ic-code"/></svg><span>代码</span></button></div>
    </footer>
  </article>
  <article class="mfx mfx-study" id="study-stamp" data-manual-motion>
    <div class="mfx-stage study-stamp">
      <div class="stamp-ticket" id="mfx-ticket">
        <h4>CORN FIELD / 收获凭证</h4>
        <div class="stamp-row"><span>地块</span><b>东坡 07</b></div>
        <div class="stamp-row"><span>本季</span><b>612.4 吨</b></div>
        <div class="stamp-area" aria-hidden="true">
          <span class="stamp-seal" id="mfx-seal">已入仓<small>CORN APPROVED</small></span>
          <i class="stamp-fleck" data-dx="-46" data-dy="-34"></i>
          <i class="stamp-fleck" data-dx="38" data-dy="-40"></i>
          <i class="stamp-fleck" data-dx="-52" data-dy="12"></i>
          <i class="stamp-fleck" data-dx="48" data-dy="20"></i>
          <i class="stamp-fleck" data-dx="-18" data-dy="44"></i>
          <i class="stamp-fleck" data-dx="22" data-dy="-52"></i>
        </div>
        <div class="stamp-cut" aria-hidden="true"></div>
        <div class="stamp-row"><span class="stamp-serial" id="mfx-serial">NO. 0000</span><span>已核验</span></div>
      </div>
    </div>
    <div class="study-ctl">
      <button type="button" class="corn-btn corn-btn-maize corn-btn-sm" id="mfx-stamp">确认收成</button>
      <output id="mfx-stamp-out" class="corn-sr-only" aria-live="polite"></output>
    </div>
    <footer class="mfx-meta"><h3 class="mfx-name">02 / 收成有回响</h3>
      <div class="mfx-actions"><button type="button" class="code-trigger" aria-haspopup="dialog" aria-expanded="false" data-code-title="盖章" data-code-html="t-stamp" data-code-css="t-studies-css" data-code-js="t-studies-js"><svg class="ic" viewBox="0 0 14 14" aria-hidden="true"><use href="#ic-code"/></svg><span>代码</span></button>
      <button type="button" class="mfx-replay" id="mfx-stamp-replay" aria-label="重播落印"><svg class="ic" viewBox="0 0 14 14" aria-hidden="true"><use href="#ic-replay"/></svg></button></div>
    </footer>
  </article>
  <article class="mfx mfx-study" id="study-type" data-manual-motion>
    <div class="mfx-stage corn-dark study-type">
      <p class="type-line" id="mfx-type" aria-label="玉米熟了"><span aria-hidden="true">玉</span><span aria-hidden="true">米</span><span aria-hidden="true">熟</span><span aria-hidden="true">了</span></p>
      <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" id="mfx-type-gust">吹过一阵风</button>
    </div>
    <footer class="mfx-meta"><h3 class="mfx-name">03 / 字里有风</h3>
      <div class="mfx-actions"><button type="button" class="code-trigger" aria-haspopup="dialog" aria-expanded="false" data-code-title="字里有风" data-code-html="t-type" data-code-css="t-studies-css" data-code-js="t-studies-js"><svg class="ic" viewBox="0 0 14 14" aria-hidden="true"><use href="#ic-code"/></svg><span>代码</span></button></div>
    </footer>
  </article>
</div>
