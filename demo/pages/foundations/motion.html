<!-- {"title": "动效", "nav": "motion"} -->
<header class="corn-dark site-hero motion-lab-hero">
  <div class="corn-shell site-hero-inner">
    <div class="mfx-field-top">
      <div class="site-hero-copy">
        <span class="corn-eyebrow corn-enter">CORN / MOTION</span>
        <h1 class="corn-h2 site-hero-title" data-split>动效</h1>
      </div>
      <div class="mfx-field-side">
        <p class="mfx-field-tagline">把秩序吹散。<br>再让它长回来。</p>
      </div>
    </div>
    <div class="mfx-field" id="mfx-field">
      <div id="mfx-cob" aria-hidden="true"><span class="corn-sr-only">CORN</span></div>
    </div>
    <div class="mfx-field-bar">
      <div class="mfx-field-modes" role="group" aria-label="玉米田形态">
        <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" data-field-mode="type" aria-pressed="true">01 成字</button>
        <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" data-field-mode="scatter" aria-pressed="false">02 散开</button>
        <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" data-field-mode="stack" aria-pressed="false">03 归仓</button>
      </div>
      <button type="button" class="corn-btn corn-btn-ghost corn-btn-sm" id="mfx-field-gust">吹一阵 ↗</button>
      <button type="button" class="code-trigger" aria-haspopup="dialog" aria-expanded="false" data-code-title="玉米粒重组" data-code-html="t-field" data-code-css="t-field-css" data-code-js="t-field-js"><svg class="ic" viewBox="0 0 14 14" aria-hidden="true"><use href="#ic-code"/></svg><span>代码</span></button>
    </div>
  </div>
</header>
<section class="corn-shell site-section site-section-flush">
  {{> motion-studies}}
  <h2 class="demo-label">基础图鉴</h2>
  {{> motion-gallery}}
  {{> motion-gallery-more}}
  {{> motion-snippets}}
  {{> motion-lab-snippets}}
  <details class="motion-notes">
    <summary class="corn-h3">参数参考</summary>
    <h2 class="demo-label">缓动与时长</h2>
    <div class="motion-lanes">
      <button type="button" class="motion-lane" style="--lane-ease:var(--corn-ease);--lane-dur:var(--corn-dur-slow)"><span class="corn-mono">ease · dur-slow 0.55s</span><span class="motion-dot" aria-hidden="true"></span><span class="motion-use">卡片浮起、开关滑块、面板展开</span></button>
      <button type="button" class="motion-lane" style="--lane-ease:var(--corn-ease-out);--lane-dur:var(--corn-dur)"><span class="corn-mono">ease-out · dur 0.2s</span><span class="motion-dot" aria-hidden="true"></span><span class="motion-use">浮层弹出、勾选描绘、提示淡入</span></button>
      <button type="button" class="motion-lane" style="--lane-ease:var(--corn-ease-in);--lane-dur:var(--corn-dur)"><span class="corn-mono">ease-in · dur 0.2s</span><span class="motion-dot" aria-hidden="true"></span><span class="motion-use">离场：通知退出、弹窗关闭</span></button>
      <button type="button" class="motion-lane" style="--lane-ease:var(--corn-ease-spring);--lane-dur:var(--corn-dur-slow)"><span class="corn-mono">ease-spring · dur-slow 0.55s</span><span class="motion-dot" aria-hidden="true"></span><span class="motion-use">回弹入场、徽标弹跳</span></button>
      <button type="button" class="motion-lane" style="--lane-ease:var(--corn-ease);--lane-dur:var(--corn-dur-fast)"><span class="corn-mono">ease · dur-fast 0.12s</span><span class="motion-dot" aria-hidden="true"></span><span class="motion-use">按下轻压、复选框缩放</span></button>
    </div>
    <h2 class="demo-label">变量</h2>
    <div class="table-wrap">{{@token-table motion}}</div>
  </details>
</section>
<link rel="stylesheet" href="{{ROOT}}assets/css/motion-lab.css">
<link rel="stylesheet" href="{{ROOT}}assets/css/motion-studies.css">
<!-- Live reduced-motion: motion-field.js + motion-studies.js both read
     Corn.reducedMotion() per frame/action and observe data-corn-motion +
     prefers-reduced-motion changes, snapping all stages instantly. -->
<script src="{{ROOT}}assets/js/motion-field.js" defer></script>
<script src="{{ROOT}}assets/js/motion-studies.js" defer></script>
<script src="{{ROOT}}assets/js/motion-gallery.js" defer></script>
