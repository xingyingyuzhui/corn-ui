<!doctype html>
<html lang="zh-CN">
<head>
{{> head}}
<title>空状态 · Corn UI</title>
</head>
<body class="corn-body" data-page="components">
{{> nav}}

<main>
  <header class="demo-page-head">
    <div class="corn-shell">
      <span class="corn-eyebrow">Components / Empty</span>
      <h1 class="corn-h2">空状态</h1>
      <p class="corn-lead" style="font-size:15px;">
        虚线井 + serif 标题 + 一句话行动指引；空状态也要是设计过的样子。
      </p>
    </div>
  </header>

  <section class="demo-section demo-section-flush">
    <div class="corn-shell">
      <div class="corn-empty" style="max-width:560px;">
        <p class="corn-empty-title">还没有内容</p>
        <p class="corn-empty-desc">点上方「新建」创建第一条。</p>
      </div>
      <div class="corn-empty" style="max-width:560px; margin-top:20px;">
        <p class="corn-empty-title">没有搜索结果</p>
        <p class="corn-empty-desc">换个关键词试试，或清除筛选条件。</p>
      </div>
    </div>
  </section>

  <section class="demo-section">
    <div class="corn-shell">
      <span class="corn-eyebrow">Rules</span>
      <h2 class="corn-h3" style="margin-top:12px;">用法</h2>
      <ul class="demo-rules" style="margin-top:20px;">
        <li>空状态说清两件事：这里将来是什么，下一步点哪里。不放装饰插画凑数。</li>
        <li>标题用 serif，说明一行话；如有多条行动，主行动接 corn-btn，次行动接 arrow-link。</li>
      </ul>
    </div>
  </section>
</main>

{{> footer}}
</body>
</html>
