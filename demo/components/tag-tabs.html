<!doctype html>
<html lang="zh-CN">
<head>
{{> head}}
<title>标签与选项卡 · Corn UI</title>
</head>
<body class="corn-body" data-page="components">
{{> nav}}

<main>
  <header class="demo-page-head">
    <div class="corn-shell">
      <span class="corn-eyebrow">Components / Tag &amp; Tabs</span>
      <h1 class="corn-h2">标签与选项卡</h1>
      <p class="corn-lead" style="font-size:15px;">
        两个小件：mono 标签承载状态/分类，segmented tabs 承载平级切换。
      </p>
    </div>
  </header>

  <section class="demo-section demo-section-flush">
    <div class="corn-shell">
      <p class="demo-label">Tag</p>
      <div class="demo-row">
        <span class="corn-tag">DEFAULT</span>
        <span class="corn-tag corn-tag-maize">MAIZE</span>
        <span class="corn-tag corn-tag-husk corn-tag-dot">运行中</span>
        <span class="corn-tag corn-tag-dot" style="color:var(--corn-danger)">异常</span>
      </div>

      <p class="demo-label">Tabs</p>
      <div class="demo-row">
        <div class="corn-tabs" role="tablist" aria-label="示例切换">
          <button role="tab" aria-selected="true">全部</button>
          <button role="tab" aria-selected="false">进行中</button>
          <button role="tab" aria-selected="false">已完成</button>
        </div>
        <div class="corn-tabs" role="tablist" aria-label="尺寸切换">
          <button role="tab" aria-selected="true">日</button>
          <button role="tab" aria-selected="false">周</button>
          <button role="tab" aria-selected="false">月</button>
          <button role="tab" aria-selected="false">年</button>
        </div>
      </div>
    </div>
  </section>

  <section class="demo-section">
    <div class="corn-shell">
      <span class="corn-eyebrow">Rules</span>
      <h2 class="corn-h3" style="margin-top:12px;">用法</h2>
      <ul class="demo-rules" style="margin-top:20px;">
        <li>tag 只做标识不做操作；可点的筛选/切换用 tabs 或按钮。</li>
        <li>tabs 是平级视图切换，不做页面导航（导航用站点 nav）。</li>
        <li>状态点用 corn-tag-dot，颜色只在 husk/maize/danger 里选。</li>
      </ul>
      <!-- @snippet tag -->
      <!-- @snippet tabs -->
    </div>
  </section>
</main>

{{> footer}}
</body>
</html>
