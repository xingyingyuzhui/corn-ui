<!-- @example {"title": "四种语气", "note": "左侧色条 + 图标 + 浅底；颜色之外标题文字也说明语气。", "layout": "stack"} -->
<div class="corn-alert" role="note">
  <span class="corn-alert-icon" aria-hidden="true">●</span>
  <p class="corn-alert-title">数据每日 06:00 更新</p>
  <p class="corn-alert-body">当前显示的是今天早上的快照。</p>
</div>
<div class="corn-alert corn-alert-brand" role="status">
  <span class="corn-alert-icon" aria-hidden="true">✓</span>
  <p class="corn-alert-title">同步完成</p>
  <p class="corn-alert-body">12 个地块的传感器数据已更新。</p>
</div>
<div class="corn-alert corn-alert-accent" role="note">
  <span class="corn-alert-icon" aria-hidden="true">!</span>
  <p class="corn-alert-title">今晚有霜冻风险</p>
  <p class="corn-alert-body">预报最低 1°C，建议提前覆膜。</p>
</div>
<div class="corn-alert corn-alert-danger" role="alert">
  <span class="corn-alert-icon" aria-hidden="true">×</span>
  <p class="corn-alert-title">3 号泵站离线</p>
  <p class="corn-alert-body">最后心跳 14 分钟前。检查电源后点“重新连接”。</p>
</div>
