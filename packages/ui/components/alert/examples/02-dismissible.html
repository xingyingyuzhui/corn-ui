<!-- @example {"title": "可关闭 + 行动", "note": "点 × 关闭：缩小淡出后从 DOM 移除，并触发 corn:dismiss。", "js": true} -->
<div class="corn-stack corn-narrow">
  <div class="corn-alert corn-alert-accent" data-corn-dismissible role="note">
    <span class="corn-alert-icon" aria-hidden="true">!</span>
    <p class="corn-alert-title">有 2 个地块待确认收割日期</p>
    <button type="button" class="corn-alert-close" data-corn-dismiss aria-label="关闭提示">×</button>
    <p class="corn-alert-body">确认后系统会自动排班。</p>
    <div class="corn-alert-actions">
      <a class="corn-arrow-link" href="#confirm">去确认 <span aria-hidden="true">→</span></a>
    </div>
  </div>
</div>
