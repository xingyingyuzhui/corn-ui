<div class="corn-stack corn-narrow">
  <label class="corn-choice">
    <input type="checkbox" role="switch" class="corn-switch" checked>
    <span class="corn-choice-text">霜冻预警<span class="corn-choice-hint">气温低于 2°C 时推送</span></span>
  </label>
  <label class="corn-choice">
    <input type="checkbox" role="switch" class="corn-switch">
    <span>夜间静默</span>
  </label>
  <label class="corn-choice">
    <input type="checkbox" role="switch" class="corn-switch" disabled>
    <span>自动收割（硬件未连接）</span>
  </label>
</div>
