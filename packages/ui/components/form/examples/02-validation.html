<!-- @example {"title": "即时校验", "note": "改坏内容再移出焦点：原生 :user-invalid 命中，字段抖一次（corn-shake）并挂上错误样式；改对后 :user-valid 给 husk 绿边。脚本同步 aria-invalid，让读屏和服务端校验复用同一套样式。"} -->
<div class="corn-stack corn-narrow">
  <div class="corn-field">
    <label class="corn-label" for="fm-slug">访问路径 / Slug</label>
    <div class="corn-input-group">
      <span class="corn-addon">corn.app/</span>
      <input id="fm-slug" class="corn-input" type="text" value="d" required pattern="[a-z\-]{2,}" aria-invalid="true" aria-describedby="fm-slug-msg">
    </div>
    <p class="corn-error-text" id="fm-slug-msg" role="alert">至少 2 个字符，只能用小写字母和连字符。</p>
  </div>
</div>
<script>
  (function () {
    var input = document.getElementById('fm-slug');
    var msg = document.getElementById('fm-slug-msg');
    input.addEventListener('blur', function () {
      var ok = input.checkValidity();
      input.setAttribute('aria-invalid', ok ? 'false' : 'true');
      msg.hidden = ok;
    });
  })();
</script>
