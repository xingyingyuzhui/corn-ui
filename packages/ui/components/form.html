<!-- Corn UI · Form -->
<div class="corn-field">
  <label class="corn-label" for="f-name">名称 / Name</label>
  <input id="f-name" class="corn-input" type="text" placeholder="输入名称">
  <p class="corn-hint">提示文字用 muted-2，12.5px。</p>
</div>

<div class="corn-field">
  <label class="corn-label" for="f-select">选项 / Select</label>
  <select id="f-select" class="corn-select">
    <option>选项一</option>
    <option>选项二</option>
  </select>
</div>

<div class="corn-field">
  <label class="corn-label" for="f-bio">描述 / Bio</label>
  <textarea id="f-bio" class="corn-textarea" rows="3" placeholder="多行输入"></textarea>
</div>
